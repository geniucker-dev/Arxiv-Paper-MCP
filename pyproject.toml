[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arxiv-paper-mcp-http"
version = "2.0.0"
description = "An arXiv MCP HTTP server for paper search and content parsing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "yzfly", email = "yz.liu.me@gmail.com" },
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<0.136",
  "httpx>=0.28,<0.29",
  "mcp>=1.27,<1.28",
  "pypdf>=6.9,<7",
  "sse-starlette>=2,<3",
  "starlette>=0.46,<0.47",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "asgi-lifespan>=2.1,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
]

[project.scripts]
arxiv-paper-mcp-http = "arxiv_paper_mcp_http.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_paper_mcp_http"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
