services:
  arxiv-paper-mcp-http:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxiv-paper-mcp-http
    restart: unless-stopped
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3000
      MCP_PATH: /mcp
      MCP_LOG_LEVEL: info
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
